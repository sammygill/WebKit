<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Layout Test: appending an absolutely positioned descendant after the number of tracks shrinks does not crash</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#abspos">
<style>
#container { width: 1000px; }
.grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(auto-fill, 100px);
}
</style>
<div id="container">
  <div class="grid"><div id="item">item</div></div>
</div>
<script>
document.body.offsetWidth;
document.getElementById("container").style.width = "500px";
document.body.offsetWidth;
var abspos = document.createElement("div");
abspos.style.cssText = "position: absolute; grid-column: 1 / 8";
document.getElementById("item").appendChild(abspos);
document.body.offsetWidth;
</script>
